name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run regression checks
        run: /usr/bin/python3 Tests/run-regressions.py
      - name: Build universal DMG
        shell: bash
        run: bash Scripts/build-dmg.sh 2>&1 | tee build.log
      - name: Check source formatting
        run: git diff --exit-code -- '*.swift'
      - name: Upload build artifacts and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eul-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
            build.log
          retention-days: 14
